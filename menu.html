<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة مطعم الذوق الملكي</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f6f1e8;
            color: #253b35;
        }

        header {
            background: #183b32;
            color: white;
            text-align: center;
            padding: 38px 15px;
        }

        header h1 {
            margin: 0 0 10px;
        }

        header p {
            margin: 0;
            color: #e5d8bd;
        }

        main {
            max-width: 650px;
            margin: 25px auto;
            padding: 0 16px;
        }

        .category {
            background: white;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px #0000000b;
        }

        .category h2 {
            color: #a66b32;
            margin-top: 0;
            border-bottom: 1px solid #eee4d5;
            padding-bottom: 10px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px dashed #ddd;
        }

        .item:last-child {
            border-bottom: none;
        }

        .price {
            font-weight: bold;
            white-space: nowrap;
            color: #183b32;
        }

        footer {
            text-align: center;
            padding: 24px;
            color: #666;
        }
    </style>
</head>

<body>
    <header>
        <h1>مطعم الذوق الملكي</h1>
        <p>قائمة الطعام التجريبية</p>
    </header>

    <main>
        <section class="category">
            <h2>🍔 الوجبات</h2>
            <div class="item">
                <span>برجر كلاسيك</span>
                <span class="price">120 جنيهًا</span>
            </div>
            <div class="item">
                <span>وجبة دجاج</span>
                <span class="price">150 جنيهًا</span>
            </div>
            <div class="item">
                <span>بطاطس مقلية</span>
                <span class="price">40 جنيهًا</span>
            </div>
        </section>

        <section class="category">
            <h2>🥤 المشروبات</h2>
            <div class="item">
                <span>عصير برتقال</span>
                <span class="price">45 جنيهًا</span>
            </div>
            <div class="item">
                <span>مياه معدنية</span>
                <span class="price">15 جنيهًا</span>
            </div>
        </section>
    </main>

    <footer>
        نموذج تجريبي للتصميم — الأسعار غير حقيقية
    </footer>
</body>

</html>
